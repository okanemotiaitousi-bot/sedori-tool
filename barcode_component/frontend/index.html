<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}
#wrapper { position: relative; width: 100%; background: #000; }
video { width: 100%; height: 240px; display: block; object-fit: cover; background:#000; }
#overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.scan-frame { width: 72%; height: 90px; position: relative; }
.corner {
  position: absolute; width: 22px; height: 22px;
  border-color: #2ecc71; border-style: solid;
}
.corner.tl { top:0;    left:0;  border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
.corner.tr { top:0;    right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
.corner.bl { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
.corner.br { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
.scan-line {
  position: absolute; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, #2ecc71, transparent);
  box-shadow: 0 0 8px #2ecc71;
  animation: sweep 1.6s ease-in-out infinite;
}
@keyframes sweep {
  0%   { top:0;    opacity:1; }
  85%  { top:100%; opacity:1; }
  100% { top:100%; opacity:0; }
}
#status-bar {
  background: rgba(0,0,0,0.88); text-align: center;
  padding: 9px 12px; font-size: 13px; color: #ccc;
}
#status-bar.success { background:#143d20; color:#2ecc71; font-weight:700; font-size:15px; }
#status-bar.error   { background:#3d1414; color:#e74c3c; }
#status-bar.warn    { background:#3d3014; color:#f39c12; }
#error-box {
  display: none; padding: 20px 16px;
  text-align: center; color: #ccc; background: #1a1a1a;
}
#error-box .icon { font-size:32px; margin-bottom:8px; }
#error-box p { font-size:13px; margin:4px 0; }
</style>
</head>
<body>

<div id="wrapper">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay">
    <div class="scan-frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line" id="scan-line"></div>
    </div>
  </div>
</div>
<div id="status-bar">📷 バーコードを枠内に合わせてください</div>
<div id="error-box">
  <div class="icon">📷</div>
  <p id="error-msg">カメラにアクセスできませんでした</p>
  <p style="margin-top:8px;color:#888">「手打ち」タブからJANコードを入力してください</p>
</div>

<script>
// ── Streamlit 通信（CDN不要）────────────────────────────
function stReady()    { try { window.parent.postMessage({ type:"streamlit:componentReady", apiVersion:1 }, "*"); } catch(_){} }
function stValue(v)   { try { window.parent.postMessage({ type:"streamlit:setComponentValue", value:v, dataType:"json" }, "*"); } catch(_){} }
function stHeight(h)  { try { window.parent.postMessage({ type:"streamlit:setFrameHeight", height:h }, "*"); } catch(_){} }

const video     = document.getElementById("video");
const statusBar = document.getElementById("status-bar");
const scanLine  = document.getElementById("scan-line");
const errorBox  = document.getElementById("error-box");
const wrapper   = document.getElementById("wrapper");

let scanning = true;
function updateHeight() { stHeight(document.body.scrollHeight); }

function showError(msg) {
  wrapper.style.display   = "none";
  statusBar.style.display = "none";
  document.getElementById("error-msg").textContent = msg;
  errorBox.style.display  = "block";
  updateHeight();
}

// ── カメラ起動（最初に実行してパーミッションダイアログを出す）──
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("このブラウザはカメラAPIに非対応です");
    return;
  }

  if (!("BarcodeDetector" in window)) {
    // カメラは起動してみるが、スキャンはできないと伝える
    statusBar.className = "warn";
    statusBar.textContent = "⚠️ このブラウザは非対応。「手打ち」タブを使ってください";
    updateHeight();
    // それでも映像は出しておく
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal:"environment" } } });
      video.srcObject = s;
      video.play();
    } catch(_) {}
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      }
    });
    video.srcObject = stream;
    video.play().catch(() => {});

    // playingイベントが来たらスキャン開始
    video.addEventListener("playing", () => {
      updateHeight();
      if (scanning) requestAnimationFrame(scanLoop);
    }, { once: true });

    // playingが来なくても1秒後に強制スタート（iOS Safari対策）
    setTimeout(() => {
      updateHeight();
      if (scanning) requestAnimationFrame(scanLoop);
    }, 1000);

  } catch (err) {
    if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
      showError("カメラの許可が必要です");
    } else if (err.name === "NotFoundError") {
      showError("カメラが見つかりませんでした");
    } else {
      showError("カメラを起動できませんでした（" + err.name + "）");
    }
  }
}

// ── スキャンループ ───────────────────────────────────────
const detector = ("BarcodeDetector" in window)
  ? new BarcodeDetector({ formats: ["ean_13","ean_8","code_128","upc_a","upc_e"] })
  : null;

async function scanLoop() {
  if (!scanning || !detector) return;
  if (video.readyState >= 2) {
    try {
      const codes = await detector.detect(video);
      if (codes.length > 0) {
        const raw = codes[0].rawValue;
        if (/^\d{8}$|^\d{13}$/.test(raw)) {
          scanning = false;
          scanLine.style.animation  = "none";
          scanLine.style.top        = "50%";
          scanLine.style.background = "#2ecc71";
          statusBar.className       = "success";
          statusBar.textContent     = "✅ 読み取り完了！　" + raw;
          updateHeight();
          setTimeout(() => stValue(raw), 350);
          return;
        }
      }
    } catch(_) {}
  }
  requestAnimationFrame(scanLoop);
}

// ── 初期化 ──────────────────────────────────────────────
stReady();
stHeight(320);
startCamera();
</script>
</body>
</html>
